<div class="topbar">
    <span class="who">Signed in as <b>{{ user.username }}</b></span>
    <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="link-btn">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            Log out
        </button>
    </form>
</div>
<nav class="nav">
    <a href="{% url 'todo_list' %}" class="{% if active == 'tasks' %}is-active{% endif %}">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Tasks
    </a>
    <a href="{% url 'category_list' %}" class="{% if active == 'categories' %}is-active{% endif %}">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        Categories
    </a>
    <a href="{% url 'stats' %}" class="{% if active == 'stats' %}is-active{% endif %}">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
        Stats
    </a>
    <a href="{% url 'trash' %}" class="{% if active == 'trash' %}is-active{% endif %}">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        Trash
    </a>
</nav>
